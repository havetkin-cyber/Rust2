name: Test – úprava cez seed (img2img, Z-Image)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['test/img2img/**', '.github/workflows/test-img2img.yml']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Odkazy na kodéry (Qwen3 4B)
        run: |
          for q in Q3_K_M Q6_K Q8_0; do curl -sIL -o /dev/null -w "$q %{http_code}\n" https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-$q.gguf; done
      - name: Zostavenie (CPU)
        run: |
          cmake -S test/img2img -B b -DCMAKE_BUILD_TYPE=Release
          cmake --build b --target test_img2img -j4
      - name: Modely Z-Image Turbo (rovnaké ako v appke)
        run: |
          mkdir m
          curl -sL -o m/z.gguf https://huggingface.co/leejet/Z-Image-Turbo-GGUF/resolve/main/z_image_turbo-Q4_0.gguf
          curl -sL -o m/llm.gguf https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          curl -sL -o m/ae.safetensors https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/vae/ae.safetensors
          ls -la m
      - name: Test
        run: |
          cd m && ../b/test_img2img z.gguf llm.gguf ae.safetensors 2>&1 | grep -E "ROZDIEL|IMG2IMG|t_enc|chyba|zlyhalo|sigma" ; ls -la *.png
      - name: Obrázky na kontrolu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-img2img -y --cleanup-tag 2>/dev/null || true
          gh release create test-img2img m/*.png --prerelease --title "Test úpravy cez seed" --notes "Automatický test – len na kontrolu"
