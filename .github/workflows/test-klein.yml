name: Test – FLUX.3 Klein
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/test-klein.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: VAE (FLUX.2) – voľne dostupná kópia
        run: |
          for u in \
            https://huggingface.co/Comfy-Org/flux2-klein-4B/resolve/main/split_files/vae/flux2-vae.safetensors \
            https://huggingface.co/Comfy-Org/flux2-klein-9B/resolve/main/split_files/vae/flux2-vae.safetensors \
            https://huggingface.co/Comfy-Org/flux2-dev/resolve/main/split_files/vae/flux2-vae.safetensors \
            https://huggingface.co/ai-toolkit/flux2_vae/resolve/main/ae.safetensors; do
            echo "VAE? $(curl -s --max-time 30 -o /dev/null -r 0-0 -L -w '%{http_code}' $u) $u"
          done
      - name: Zostavenie (CPU)
        run: |
          cmake -S test/img2img -B b -DCMAKE_BUILD_TYPE=Release
          cmake --build b --target test_img2img -j4
      - name: Modely
        timeout-minutes: 40
        run: |
          mkdir m
          D() { echo "== $1"; curl -fL --retry 3 --max-time 1500 -sS -o "$2" -w "%{http_code} %{size_download} B %{speed_download} B/s\n" "$1"; }
          D https://huggingface.co/leejet/flux-3-image-klein-GGUF/resolve/main/flux3-image-klein-Q4_0.gguf m/k.gguf
          D https://huggingface.co/unsloth/Qwen3-VL-4B-Instruct-GGUF/resolve/main/Qwen3-VL-4B-Instruct-Q4_K_M.gguf m/llm.gguf
          for u in https://huggingface.co/Comfy-Org/flux2-klein-4B/resolve/main/split_files/vae/flux2-vae.safetensors https://huggingface.co/Comfy-Org/flux2-klein-9B/resolve/main/split_files/vae/flux2-vae.safetensors https://huggingface.co/Comfy-Org/flux2-dev/resolve/main/split_files/vae/flux2-vae.safetensors https://huggingface.co/ai-toolkit/flux2_vae/resolve/main/ae.safetensors; do
            D $u m/ae.safetensors && [ $(stat -c%s m/ae.safetensors) -gt 300000000 ] && { echo "VAE z $u"; break; }
          done
          ls -la m
      - name: Test (16 krokov, 512)
        timeout-minutes: 90
        run: |
          cd m && ../b/test_img2img k.gguf llm.gguf ae.safetensors 16 512 2>&1 | grep -E "ROZDIEL|chyba|zlyhalo|Version|completed|sampling completed" ; ls -la *.png
      - name: Obrázky
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete test-klein -y --cleanup-tag 2>/dev/null || true
          gh release create test-klein m/*.png --prerelease --title "Test FLUX.3 Klein" --notes "Automatický test"
