name: Alexia AI – APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Spoločné číslo verzie (rovnaké pre mobil, Windows aj Linux)
        shell: bash
        run: echo "VERZIA_N=$(git rev-list --count HEAD)" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: NDK a CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Zostaviť APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PversionCode=${{ env.VERZIA_N }}
      - name: Počkať na PC verzie (rovnaká verzia všade)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/skripty/cakaj.sh linux.yml "Kontrola Kotlinu (rýchla)" 60
          bash .github/skripty/cakaj.sh windows.yml "Kontrola Kotlinu (rýchla)" 60
      - name: Vydať
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.2.${{ env.VERZIA_N }}"
          cp app/build/outputs/apk/release/app-release.apk AlexiaAI.apk
          # linuxový ZIP z predchádzajúceho vydania prenesieme, aby odkaz "latest" fungoval pre oba
          for p in AlexiaAI-Linux.zip AlexiaAI-x86_64.AppImage linux-verzia.txt AlexiaAI-Windows.zip windows-verzia.txt; do gh release download --pattern "$p" -D predosle 2>/dev/null || true; done
          SUBORY="AlexiaAI.apk"; for f in predosle/*; do [ -f "$f" ] && SUBORY="$SUBORY $f"; done
          gh release create "v$V" $SUBORY --latest --target "$GITHUB_SHA" \
            --title "Alexia AI $V" \
            --notes "Lokálny AI chat (llama.cpp) – beží offline v mobile. Stiahni AlexiaAI.apk a nainštaluj."

