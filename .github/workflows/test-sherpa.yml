name: Test – sherpa-onnx (Supertonic)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-sherpa.yml']
env:
  T: v2.0.2
jobs:
  asr:
    runs-on: ubuntu-22.04
    steps:
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh api repos/k2-fsa/sherpa-onnx/releases/tags/asr-models --paginate --jq '.assets[] | select(.name|test("whisper")) | "\(.name) \(.size)"' | sort | head -40
          gh api "repos/k2-fsa/sherpa-onnx/contents/sherpa-onnx/kotlin-api?ref=$T" --jq '.[].name' | tr '\n' ' '; echo
          curl -sL https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$T/sherpa-onnx/kotlin-api/OfflineRecognizer.kt -o r.kt; grep -n "^import\|class \|data class\|fun \|var whisper\|Whisper" r.kt | head -80
          grep -rhn "^import" r.kt
          for f in FeatureConfig.kt OfflineStream.kt QnnConfig.kt HomophoneReplacerConfig.kt; do curl -sfL https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$T/sherpa-onnx/kotlin-api/$f -o $f && echo "== $f" && grep -n "class \|fun \|^import" $f | head -20; done
          curl -sL https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$T/sherpa-onnx/java-api/src/main/java/com/k2fsa/sherpa/onnx/OfflineWhisperModelConfig.java | grep -n "public\|private" | head -30
          curl -sL https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$T/sherpa-onnx/java-api/src/main/java/com/k2fsa/sherpa/onnx/OfflineRecognizer.java | grep -n "public" | head -30
          curl -sL https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$T/sherpa-onnx/java-api/src/main/java/com/k2fsa/sherpa/onnx/OfflineStream.java | grep -n "public" | head -30
          curl -sL https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$T/sherpa-onnx/java-api/src/main/java/com/k2fsa/sherpa/onnx/OfflineModelConfig.java | grep -n "public Builder set" | head -40
