name: Test – sherpa-onnx (Supertonic)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-sherpa.yml']
jobs:
  hf:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          curl -s "https://huggingface.co/api/models/lightx2v/Autoencoders" | python3 -c "
          import sys,json; j=json.load(sys.stdin); print('gated',j.get('gated'))
          [print(s['rfilename']) for s in j.get('siblings',[])]"
          curl -sIL -o /dev/null -w "%{http_code} %{size_download}\n" https://github.com/madebyollin/taehv/raw/refs/heads/main/safetensors/taew2_2.safetensors
          curl -sL https://github.com/madebyollin/taehv/raw/refs/heads/main/safetensors/taew2_2.safetensors -o t.st; ls -la t.st
          python3 -c "
          import json,struct; b=open('t.st','rb').read(); n=struct.unpack('<Q',b[:8])[0]; h=json.loads(b[8:8+n]); ks=[k for k in h if k!='__metadata__']; print(len(ks), ks[:8])"
          for f in lighttaew2_2.safetensors lighttaew2_2.pth; do curl -sL -o $f https://huggingface.co/lightx2v/Autoencoders/resolve/main/$f; ls -la $f; done
          python3 -c "
          import json,struct; b=open('lighttaew2_2.safetensors','rb').read(); n=struct.unpack('<Q',b[:8])[0]; h=json.loads(b[8:8+n]); ks=[k for k in h if k!='__metadata__']; print(len(ks), ks[:8])" || true
