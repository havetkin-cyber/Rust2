name: Test – sherpa-onnx (Supertonic)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-sherpa.yml']
env:
  T: v2.0.2
jobs:
  java:
    runs-on: ubuntu-22.04
    steps:
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh api "repos/k2-fsa/sherpa-onnx/contents/sherpa-onnx/java-api/src/main/java/com/k2fsa/sherpa/onnx?ref=$T" --jq '.[].name' | tr '\n' ' '
          echo
          mkdir j && cd j
          for f in OfflineTts OfflineTtsConfig OfflineTtsModelConfig OfflineTtsSupertonicModelConfig GenerationConfig GeneratedAudio LibraryUtils; do
            curl -sfL https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$T/sherpa-onnx/java-api/src/main/java/com/k2fsa/sherpa/onnx/$f.java -o $f.java && echo "=== $f" && grep -vE "^\s*(//|\*|/\*)|^\s*$|^import" $f.java | head -80
          done
          cd .. && curl -sL -o n.jar https://github.com/k2-fsa/sherpa-onnx/releases/download/$T/sherpa-onnx-native-lib-linux-x64-2.0.2.jar && unzip -l n.jar
          curl -sL -o w.jar https://github.com/k2-fsa/sherpa-onnx/releases/download/$T/sherpa-onnx-native-lib-win-x64-2.0.2.jar && unzip -l w.jar
