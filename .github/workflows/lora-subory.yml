name: Pomocné – súbory LoRA (dočasné)
on:
  push:
    branches: [lora-katalog]
    paths: ['.github/workflows/lora-subory.yml']
jobs:
  zoznam:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in josegomezfreelance/improved_dance_v2_soft_wan22_5b_jgf 9r4n4y/Z-Image-Turbo-Ghibli-Style-backup oshi-pog/zimage-flat-color-v2-1 \
                   frankbarbs/darkroom-noir-zimage jarod2212/LumaBlend_ZIT lxe/holosomnia-zimage-turbo-lora hugovntr/flux-schnell-realism \
                   p1atdev/flux.1-schnell-pvc-style-lora lucas-mella/Daimon-R Kijai/WanVideo_comfy; do
            echo "=== $r"
            curl -s "https://huggingface.co/api/models/$r?blobs=true" | jq -r '.siblings[] | select(.rfilename|test("safetensors|gguf")) | select(.rfilename|test("LoRAs/Wan22-Turbo|^[^/]*$|lora"; "i")) | "\(.size) \(.rfilename)"' | head -40
            curl -s "https://huggingface.co/api/models/$r" | jq -r '"tags: " + (.tags|join(","))' 
          done
          echo "=== UnifiedHorusRA/t3 (5B)"
          curl -s "https://huggingface.co/api/models/UnifiedHorusRA/t3?blobs=true" | jq -r '.siblings[] | select(.rfilename|test("TI2V-5B/")) | "\(.size) \(.rfilename)"'
