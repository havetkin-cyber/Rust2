name: Test – sherpa-onnx (Supertonic)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-sherpa.yml']
env:
  T: v2.0.2
jobs:
  asr:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          B=https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$T/sherpa-onnx
          curl -sL $B/kotlin-api/OfflineRecognizer.kt -o r.kt; sed -n '1,20p;92,102p;144,235p' r.kt
          curl -sL $B/kotlin-api/FeatureConfig.kt
          curl -sL $B/java-api/src/main/java/com/k2fsa/sherpa/onnx/OfflineRecognizerConfig.java | grep -n "public"
          curl -sL $B/java-api/src/main/java/com/k2fsa/sherpa/onnx/OfflineRecognizerResult.java | grep -n "public"
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-small.tar.bz2 | tar -tvj
