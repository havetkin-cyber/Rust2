name: Kontrola vetvy (bez vydania)
# Len preklad Kotlinu na vedľajších vetvách – nič sa nevydáva, verzia sa nemení.
on:
  push:
    branches-ignore: [main]
jobs:
  kotlin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Kontrola Kotlinu (PC / Linux)
        run: |
          cd linux
          chmod +x ./gradlew
          ./gradlew compileKotlin --no-daemon
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Kontrola Kotlinu (mobil)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon
