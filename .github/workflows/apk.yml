name: Alexia AI – APK

on:
  push:
    branches: [main]
    paths-ignore: ['linux/**', '.github/workflows/linux.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: NDK a CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Zostaviť APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }}
      - name: Vydať
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk AlexiaAI.apk
          # linuxový ZIP z predchádzajúceho vydania prenesieme, aby odkaz "latest" fungoval pre oba
          gh release download --pattern AlexiaAI-Linux.zip -D predosle 2>/dev/null || true
          SUBORY="AlexiaAI.apk"; [ -f predosle/AlexiaAI-Linux.zip ] && SUBORY="$SUBORY predosle/AlexiaAI-Linux.zip"
          gh release create "v$V" $SUBORY --latest --target "$GITHUB_SHA" \
            --title "Alexia AI $V" \
            --notes "Lokálny AI chat (llama.cpp) – beží offline v mobile. Stiahni AlexiaAI.apk a nainštaluj."

