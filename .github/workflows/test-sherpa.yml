name: Test – sherpa-onnx (Supertonic)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-sherpa.yml']
jobs:
  mix:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2 | tar -xj
          D=sherpa-onnx-supertonic-3-tts-int8-2026-05-11
          grep -n -i "voice" $D/README.md | head -30
          xxd $D/voice.bin | head -5
          python3 -c "
          import struct; b=open('$D/voice.bin','rb').read(); print(len(b)); print(struct.unpack('<16i', b[:64])); print(struct.unpack('<16f', b[:64]))"
          python3 -c "import json; j=json.load(open('$D/tts.json')); print(list(j.keys())); print({k:(v if not isinstance(v,(list,dict)) else type(v).__name__) for k,v in j.items()})"
