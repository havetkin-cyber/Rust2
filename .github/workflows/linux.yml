name: Alexia AI – Linux / SteamOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Linux / SteamOS (x86_64, Vulkan pre grafiku AMD). Ubuntu 22.04 = staršie glibc, beží aj na SteamOS.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Spoločné číslo verzie (rovnaké pre mobil, Windows aj Linux)
        shell: bash
        run: echo "VERZIA_N=$(git rev-list --count HEAD)" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Kontrola Kotlinu (rýchla)
        run: |
          cd linux
          chmod +x ./gradlew
          ./gradlew compileKotlin --no-daemon
      - name: Vulkan SDK a nástroje
        run: |
          sudo apt-get update -y && sudo apt-get install -y ninja-build zip
          V=$(curl -s https://vulkan.lunarg.com/sdk/latest/linux.txt)
          echo "Vulkan SDK $V"
          curl -sL "https://sdk.lunarg.com/sdk/download/$V/linux/vulkan_sdk.tar.xz" -o vulkan_sdk.tar.xz
          mkdir -p vulkan_sdk && tar -xf vulkan_sdk.tar.xz -C vulkan_sdk --strip-components=1
      - name: Natívne knižnice (llama.cpp + stable-diffusion.cpp, Vulkan)
        run: |
          source vulkan_sdk/setup-env.sh
          cmake -S linux/native/llama -B build-llama -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-llama -j4 --target alexiaai
          cmake -S linux/native/sd -B build-sd -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sd -j3 --target alexiasd
          cp build-llama/libalexiaai.so build-sd/libalexiasd.so linux/resources/linux-x64/
          ldd linux/resources/linux-x64/*.so
      - name: Balík pre Linux
        run: |
          cd linux
          chmod +x ./gradlew
          ./gradlew packageAppImage --no-daemon --stacktrace -Pverzia=1.2.${{ env.VERZIA_N }}
      - name: Počkať na mobilnú verziu (rovnaká verzia všade)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/skripty/cakaj.sh apk.yml "*" 90
      - name: ZIP a vydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p AlexiaAI-Linux
          cp -a linux/build/compose/binaries/main/app/AlexiaAI AlexiaAI-Linux/
          cp linux/spustit.sh linux/nainstalovat.sh linux/ikona.png linux/CITAJ.txt AlexiaAI-Linux/
          chmod +x AlexiaAI-Linux/spustit.sh AlexiaAI-Linux/nainstalovat.sh AlexiaAI-Linux/AlexiaAI/bin/AlexiaAI
          ls -la AlexiaAI-Linux AlexiaAI-Linux/AlexiaAI/lib/app/resources || true
          zip -r -y -q AlexiaAI-Linux.zip AlexiaAI-Linux
          ls -la AlexiaAI-Linux.zip
          # jeden súbor AppImage: stiahnuť, dvojklik, hotovo
          cp -a linux/build/compose/binaries/main/app/AlexiaAI AlexiaAI.AppDir
          cp linux/appimage/AppRun linux/appimage/alexia-ai.desktop AlexiaAI.AppDir/
          cp linux/ikona.png AlexiaAI.AppDir/alexia-ai.png
          cp linux/ikona.png AlexiaAI.AppDir/.DirIcon
          chmod +x AlexiaAI.AppDir/AppRun AlexiaAI.AppDir/bin/AlexiaAI
          curl -sL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --no-appstream AlexiaAI.AppDir AlexiaAI-x86_64.AppImage
          ls -la AlexiaAI-x86_64.AppImage
          # pridá ZIP k najnovšiemu vydaniu (tam, kde je aj APK)
          TAG="v1.2.${{ env.VERZIA_N }}"
          echo "1.2.${{ env.VERZIA_N }}" > linux-verzia.txt
          gh release upload "$TAG" AlexiaAI-Linux.zip AlexiaAI-x86_64.AppImage linux-verzia.txt --clobber
          echo "Pridané k vydaniu $TAG"
          # stály kanál aktualizácií – appka sa pozerá sem
          gh release view aktualizacie >/dev/null 2>&1 || gh release create aktualizacie --prerelease --title "Aktualizácie (PC)" --notes "Stály kanál aktualizácií pre Windows a Linux"
          # kanál aktualizácií: Linux a Windows nahrávajú naraz, GitHub občas vráti 404 – skúsiť znova
          # staršie zostavenie, ktoré dobehne neskôr, nesmie prepísať novšiu verziu v kanáli
          moja=$(tr -d '[:space:]' < linux-verzia.txt | awk -F. '{print $NF}')
          kanal=0
          if gh release download aktualizacie -p linux-verzia.txt -O kanal-verzia.txt --clobber 2>/dev/null; then kanal=$(tr -d '[:space:]' < kanal-verzia.txt | awk -F. '{print $NF}'); fi
          if [ "${kanal:-0}" -gt "$moja" ]; then echo "Kanál už má novšiu verziu ($kanal) – preskakujem"; exit 0; fi
          ok=0; for i in 1 2 3 4 5; do gh release upload aktualizacie AlexiaAI-Linux.zip AlexiaAI-x86_64.AppImage linux-verzia.txt --clobber && { ok=1; break; }; sleep $((15*i)); done
          [ "$ok" = 1 ]
