name: Test – sherpa-onnx (Supertonic)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-sherpa.yml']
jobs:
  hf:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          for r in leejet/flux-3-image-klein-GGUF Qwen/Qwen3-VL-4B-Instruct-GGUF unsloth/Qwen3-VL-4B-Instruct-GGUF Comfy-Org/flux2-dev Comfy-Org/flux2-klein Comfy-Org/flux-3-image-klein black-forest-labs/flux-3-image-klein-comfy; do
            echo "== $r"
            curl -s "https://huggingface.co/api/models/$r?blobs=true" | python3 -c "
          import sys,json
          try: j=json.load(sys.stdin)
          except Exception as e: print('ERR',e); sys.exit()
          print('gated',j.get('gated'), j.get('error',''))
          for s in j.get('siblings',[]):
              n=s['rfilename']
              if n.endswith(('.gguf','.safetensors')) and ('vae' in n.lower() or 'ae.' in n.lower() or 'Q4' in n or 'Q3' in n or 'Q5' in n or 'Q6' in n or 'Q8' in n or 'klein' in n.lower()): print(' ',n, s.get('size'))
          "
          done
          curl -s "https://huggingface.co/api/models?search=flux2-vae&limit=10" | python3 -c "import sys,json; [print(m['id']) for m in json.load(sys.stdin)]"
          curl -s "https://huggingface.co/api/models?search=flux.2+vae&limit=10" | python3 -c "import sys,json; [print(m['id']) for m in json.load(sys.stdin)]"
