name: Alexia AI – Windows (PC)

on:
  push:
    branches: [main]
    paths: ['linux/**', 'app/src/main/cpp/**', 'obrazky/src/main/cpp/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # Rovnaká appka ako pre Linux (Compose Desktop) – na Windows s grafikou cez Vulkan (NVIDIA, AMD aj Intel)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Kontrola Kotlinu (rýchla)
        shell: bash
        run: cd linux && ./gradlew compileKotlin --no-daemon
      - name: Vulkan SDK
        shell: pwsh
        run: |
          $v = (Invoke-WebRequest -UseBasicParsing https://vulkan.lunarg.com/sdk/latest/windows.txt).Content.Trim()
          Write-Host "Vulkan SDK $v"
          Invoke-WebRequest -UseBasicParsing "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe" -OutFile vulkan.exe
          if ((Get-Item vulkan.exe).Length -lt 10000000) { Invoke-WebRequest -UseBasicParsing "https://sdk.lunarg.com/sdk/download/$v/windows/VulkanSDK-$v-Installer.exe" -OutFile vulkan.exe }
          Start-Process -Wait -FilePath .\vulkan.exe -ArgumentList "--root","C:\VulkanSDK","--accept-licenses","--default-answer","--confirm-command","install"
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Get-ChildItem C:\VulkanSDK\Bin\glslc.exe
      - name: Natívne knižnice (llama.cpp + stable-diffusion.cpp, Vulkan)
        shell: pwsh
        run: |
          cmake -S linux/native/llama -B build-llama -A x64
          cmake --build build-llama --config Release --target alexiaai -j 4
          cmake -S linux/native/sd -B build-sd -A x64
          cmake --build build-sd --config Release --target alexiasd -j 3
          Copy-Item build-llama/Release/alexiaai.dll, build-sd/Release/alexiasd.dll linux/resources/windows-x64/
          Get-ChildItem linux/resources/windows-x64
      - name: Balík pre Windows
        shell: bash
        run: cd linux && ./gradlew createDistributable --no-daemon --stacktrace -Pverzia=1.1.${{ github.run_number }}
      - name: ZIP a vydanie
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory AlexiaAI-Windows | Out-Null
          Copy-Item -Recurse linux/build/compose/binaries/main/app/AlexiaAI/* AlexiaAI-Windows/
          Set-Content -Encoding UTF8 AlexiaAI-Windows/CITAJ.txt "Alexia AI pre Windows`r`n`r`nSpusti AlexiaAI.exe. Modely, chat a obrazky su v %LOCALAPPDATA%\AlexiaAI.`r`nAktualizaciu rozbal cez tento priecinok - nic sa nestrati."
          Compress-Archive -Path AlexiaAI-Windows -DestinationPath AlexiaAI-Windows.zip
          Get-Item AlexiaAI-Windows.zip
          "1.1.${{ github.run_number }}" | Set-Content -NoNewline windows-verzia.txt
          $tag = gh release view --json tagName -q .tagName
          gh release upload $tag AlexiaAI-Windows.zip windows-verzia.txt --clobber
          Write-Host "Pridane k vydaniu $tag"
